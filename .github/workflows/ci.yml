name: DevGuard AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          cd backend
          ruff check app tests

      - name: Security Vulnerability Scan (Bandit)
        run: |
          cd backend
          bandit -r app -x app/core/security.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devguard_test
          ENVIRONMENT: test
        run: |
          cd backend
          pytest -v

  frontend-checks:
    name: Frontend Typecheck, Lint & Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Production Vite Build & Strict Type Check
        run: |
          cd frontend
          npm run build
