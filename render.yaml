version: "1"

databases:
  - name: devguard-db
    databaseName: devguard
    user: devguard_user
    plan: free
    region: oregon

services:
  - type: web
    name: devguard-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devguard-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: none
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
